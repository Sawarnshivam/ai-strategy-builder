services:
  postgres:
    image: postgres:16-alpine
    container_name: backtest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: backtest
      POSTGRES_PASSWORD: backtest
      POSTGRES_DB: backtest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtest -d backtest_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: